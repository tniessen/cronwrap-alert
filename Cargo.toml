[package]
name = "cronwrap-alert"
version = "0.1.0"
authors = ["Tobias Nießen <tniessen@tnie.de>"]
publish = false
edition = "2021"

[lib]
name = "cronwrap"
#path = "src/lib.rs"

[[bin]]
name = "cronwrap-alert"
#path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
gethostname = "1.1.0"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tiny_http = "0.12.0"
